name: Webinar Live Attendee Alerts

on:
  schedule:
    # Runs hourly at :50. Each run asks Demio for sessions (across ALL
    # events) starting in the following hour; if it finds any, it stays
    # alive and posts the 2- and 15-minute alerts for each, anchored to the
    # session's scheduled start time. Runs that find nothing exit in
    # seconds. No editing needed when webinar times change.
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the alerts instead of posting to Slack'
        type: boolean
        default: true

jobs:
  alerts:
    runs-on: ubuntu-latest
    # A run may wait up to ~70 minutes for a session late in its window,
    # plus 15 minutes of alerting.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run webinar-alerts
        env:
          DEMIO_API_KEY: ${{ secrets.DEMIO_API_KEY }}
          DEMIO_API_SECRET: ${{ secrets.DEMIO_API_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Channel name works for public channels the bot has been invited
          # to. Set the WEBINAR_ALERTS_CHANNEL secret to a channel ID
          # (C0XXXXXXX) to override — required if the channel is private.
          WEBINAR_ALERTS_CHANNEL: ${{ secrets.WEBINAR_ALERTS_CHANNEL || '#collective-webinars' }}
          # Uncomment if Demio reports session times without a timezone and
          # they come back shifted (check a dry run's log):
          # DEMIO_TIMEZONE: America/New_York
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
