name: Webinar Live Attendee Alerts

on:
  schedule:
    # ==========================================================================
    # EDIT THIS to your weekly webinar's START time, converted to UTC.
    # The script itself handles the "2 minutes in" and "15 minutes in" timing —
    # this cron just needs to fire at (or a couple minutes before) start time.
    #
    # GitHub Actions cron is UTC and does NOT adjust for daylight saving:
    #   e.g. a Wednesday 12:00pm ET webinar = '0 16 * * 3' during EDT (Mar-Nov)
    #                                       = '0 17 * * 3' during EST (Nov-Mar)
    # Placeholder below: Wednesday 12:00pm EDT.
    # ==========================================================================
    - cron: '0 16 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the alerts instead of posting to Slack'
        type: boolean
        default: false

# Never let two runs post duplicate alerts for the same webinar.
concurrency:
  group: webinar-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    # The job stays alive waiting for the 15-minute mark, so give it headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run webinar-alerts
        env:
          DEMIO_API_KEY: ${{ secrets.DEMIO_API_KEY }}
          DEMIO_API_SECRET: ${{ secrets.DEMIO_API_SECRET }}
          DEMIO_EVENT_ID: ${{ secrets.DEMIO_EVENT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          WEBINAR_ALERTS_CHANNEL_ID: ${{ secrets.WEBINAR_ALERTS_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
