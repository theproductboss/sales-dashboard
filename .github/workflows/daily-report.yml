name: Daily Sales Dashboard

on:
  schedule:
    # 8:00am America/New_York. GitHub Actions cron always runs in UTC and
    # does NOT adjust for daylight saving automatically:
    #   EDT (Mar-Nov): 8am ET = 12:00 UTC  -> cron below
    #   EST (Nov-Mar): 8am ET = 13:00 UTC  -> update to '0 13 * * *' when DST ends
    - cron: '0 12 * * *'
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run report
        env:
          CALENDLY_API_TOKEN: ${{ secrets.CALENDLY_API_TOKEN }}
          CALENDLY_ORG_URI: ${{ secrets.CALENDLY_ORG_URI }}
          CALENDLY_OZ_USER_URI: ${{ secrets.CALENDLY_OZ_USER_URI }}
          CALENDLY_BLAKE_USER_URI: ${{ secrets.CALENDLY_BLAKE_USER_URI }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CASH_REPORT_CHANNEL_ID: ${{ secrets.CASH_REPORT_CHANNEL_ID }}
          DASHBOARD_CHANNEL_ID: ${{ secrets.DASHBOARD_CHANNEL_ID }}
          REPORT_TIMEZONE: America/New_York
