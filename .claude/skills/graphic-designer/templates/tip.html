<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="{{W}}x{{H}}">{{google_fonts}}<style>{{brand_css}}:root{--w:{{W}}px;--h:{{H}}px}{{base_css}}
.page{background:var(--bg)}
.num{position:absolute;right:60px;top:40px;font-family:var(--font-head);font-weight:700;font-size:520px;line-height:1;color:transparent;-webkit-text-stroke:4px var(--secondary);letter-spacing:-.04em}
.txt{position:absolute;left:88px;right:88px;bottom:190px}
.txt .kicker{margin-bottom:30px}
.headline{font-size:88px;color:var(--primary);margin-bottom:34px}
.rule{width:100%;height:2px;background:var(--primary);opacity:.15;margin-bottom:34px}
.foot{color:var(--primary)}
</style></head><body><div class="page">
<div class="num">{{number}}</div>
<div class="txt"><div class="kicker">{{kicker}}</div><h2 class="headline">{{headline}}</h2><div class="rule"></div><p class="body">{{body}}</p></div>
<div class="foot">{{brand_mark}}<span class="counter">{{counter}}</span></div>
</div></body></html>
