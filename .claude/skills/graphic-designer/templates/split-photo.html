<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="{{W}}x{{H}}">{{google_fonts}}<style>{{brand_css}}:root{--w:{{W}}px;--h:{{H}}px}{{base_css}}
.top{position:absolute;left:0;right:0;top:0;height:56%;overflow:hidden}
.top img{width:100%;height:100%;object-fit:cover}
.txt{position:absolute;left:88px;right:88px;top:calc(56% + 72px)}
.txt .kicker{margin-bottom:26px}
.headline{font-size:76px;color:var(--primary);margin-bottom:26px}
.foot{color:var(--primary)}
</style></head><body><div class="page">
<div class="top"><img src="{{image}}" style="object-position:{{image_pos}}"></div>
<div class="txt"><div class="kicker">{{kicker}}</div><h2 class="headline">{{headline}}</h2><p class="body">{{body}}</p></div>
<div class="foot">{{brand_mark}}<span class="counter">{{counter}}</span></div>
</div></body></html>
