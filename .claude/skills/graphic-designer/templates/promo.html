<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="{{W}}x{{H}}">{{google_fonts}}<style>{{brand_css}}:root{--w:{{W}}px;--h:{{H}}px}{{base_css}}
.page{background:var(--bg)}
.band{position:absolute;left:0;right:0;top:0;height:640px;background:var(--secondary);opacity:.45}
.card{position:absolute;left:150px;right:150px;top:120px;height:640px;border-radius:32px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.45)}
.card img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;right:100px;top:80px;width:230px;height:230px;border-radius:50%;background:var(--accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(8deg);box-shadow:0 20px 40px -15px rgba(0,0,0,.4)}
.badge b{font-family:var(--font-head);font-size:76px;line-height:1}
.badge span{font-size:22px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-top:6px}
.badge:has(b:empty){display:none}
.txt{position:absolute;left:88px;right:88px;top:830px;text-align:center}
.txt .kicker{justify-content:center;margin-bottom:22px}
.txt .kicker:before{display:none}
.headline{font-size:84px;color:var(--primary);margin-bottom:22px}
.offer{font-size:38px;line-height:1.35;margin:0 auto 36px;max-width:760px;text-wrap:balance}
.offer:empty{display:none}
.foot{color:var(--primary);justify-content:center}
.foot .counter{display:none}
</style></head><body><div class="page">
<div class="band"></div>
<div class="card"><img src="{{image}}" style="object-position:{{image_pos}}"></div>
<div class="badge"><b>{{price}}</b><span>{{badge}}</span></div>
<div class="txt"><div class="kicker">{{kicker}}</div><h2 class="headline">{{headline}}</h2><p class="offer">{{offer}}</p><span class="pill">{{cta}}</span></div>
<div class="foot">{{brand_mark}}<span class="counter">{{counter}}</span></div>
</div></body></html>
