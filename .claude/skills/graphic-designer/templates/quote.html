<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="{{W}}x{{H}}">{{google_fonts}}<style>{{brand_css}}:root{--w:{{W}}px;--h:{{H}}px}{{base_css}}
.page{background:var(--primary);color:var(--bg)}
.mark{position:absolute;left:70px;top:60px;font-family:var(--font-head);font-size:420px;line-height:1;color:var(--secondary);opacity:.9}
.txt{position:absolute;left:88px;right:88px;top:330px;bottom:170px;display:flex;flex-direction:column;justify-content:center}
.stars{color:var(--secondary);font-size:52px;letter-spacing:.12em;margin-bottom:40px}
.q{font-family:var(--font-head);font-weight:500;font-size:76px;line-height:1.2;letter-spacing:-.015em;text-wrap:balance}
.who{margin-top:54px;font-size:28px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--secondary)}
.foot{color:var(--bg)}
</style></head><body><div class="page">
<div class="mark">&ldquo;</div>
<div class="txt"><div class="stars">{{stars_html}}</div><p class="q">{{quote}}</p><div class="who">{{name}}</div></div>
<div class="foot">{{brand_mark}}<span class="counter">{{counter}}</span></div>
</div></body></html>
